appId: com.hintly.desktop
productName: Hintly
icon: public/icon.png

win:
  target: nsis
  icon: public/icon.ico

nsis:
  oneClick: true
  perMachine: false

mac:
  target: dmg
  icon: public/icon.png
  category: public.app-category.education

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

directories:
  output: release

files:
  - dist/**/*
  - public/**/*

extraResources:
  - public/audio-worklet-processor.js
